name: Analyze workouts
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to configured private Supabase account
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a private repository for personal source data
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo 'Make this repository private before committing personal exports to source/. Public git history exposes your files.'
            exit 1
          fi
      - name: Run analysis tests
        run: python -m unittest discover -s tests -v
      - name: Analyze and optionally publish
        env:
          PUBLISH: ${{ inputs.publish }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKOUT_OWNER_ID: ${{ secrets.WORKOUT_OWNER_ID }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python analyzer/analyze.py --publish
          else
            python analyzer/analyze.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: private-workout-report
          path: private-output/report.json
          retention-days: 7

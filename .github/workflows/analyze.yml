name: Analyze workouts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['source/**', 'analyzer/**', 'web/**', 'tests/**', '.github/workflows/analyze.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: workout-pages
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test analysis
        run: python -m unittest discover -s tests -v
      - name: Build dashboard and preserve profile versions
        run: python analyzer/build_site.py
      - name: Save profile history back to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/history/profile_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive workout profile revision [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish workout dashboard
        id: deployment
        uses: actions/deploy-pages@v4
